name: Pack and nuget

on:
  push:
    tags:
      # 仅 Ez2Lazer 发布标签触发，避免 git push --tags 把 ppy 历史标签也推上去后误发布
      - '*-ez2lazer'
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet 包版本（与 tag 名一致，例如 2026.524.0-ez2lazer）'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve package version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set artifacts directory
        id: artifactsPath
        run: echo "nuget_artifacts=${{ github.workspace }}/artifacts" >> "$GITHUB_OUTPUT"

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Pack
        run: dotnet pack -c Release osu.Game.Resources /p:Version=${{ steps.version.outputs.value }} /p:GenerateDocumentationFile=true /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg -o ${{ steps.artifactsPath.outputs.nuget_artifacts }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-resources
          path: |
            ${{ steps.artifactsPath.outputs.nuget_artifacts }}/*.nupkg
            ${{ steps.artifactsPath.outputs.nuget_artifacts }}/*.snupkg

      # NuGet 可信发布：SK-la/osu-resources + deploy.yml（无需长期 NUGET_API_KEY）
      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: SK_LA

      - name: Publish packages to nuget.org
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          LOG="${RUNNER_TEMP}/nuget-push.log"
          : > "$LOG"
          FAILED=0
          for pkg in "${{ steps.artifactsPath.outputs.nuget_artifacts }}"/*.nupkg; do
            set +e
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              2>&1 | tee -a "$LOG"
            [ $? -ne 0 ] && FAILED=1
            set -e
          done
          if [ "$FAILED" -ne 0 ]; then
            if grep -qiE 'already exists|package ID is reserved' "$LOG"; then
              echo "::error::推送失败。若 reserved：包 ID 被保留；若 already exists：版本 ${VERSION} 已存在。"
              echo "https://www.nuget.org/packages/ez2lazer.Game.Resources/${VERSION}"
              echo "若要发布新内容，请使用新 tag，不要重复推送同一版本。"
            fi
            exit 1
          fi
          echo "Published (Trusted Publishing): https://www.nuget.org/packages/ez2lazer.Game.Resources/${VERSION}"
