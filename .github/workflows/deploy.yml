name: Pack and nuget

on:
  push:
    tags:
      # 仅 Ez2Lazer 发布标签触发，避免 git push --tags 把 ppy 历史标签也推上去后误发布
      - '*-ez2lazer'
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet 包版本（与 tag 名一致，例如 2026.524.0-ez2lazer）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve package version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set artifacts directory
        id: artifactsPath
        run: echo "nuget_artifacts=${{ github.workspace }}/artifacts" >> "$GITHUB_OUTPUT"

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Pack
        run: dotnet pack -c Release osu.Game.Resources /p:Version=${{ steps.version.outputs.value }} /p:GenerateDocumentationFile=true /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg -o ${{ steps.artifactsPath.outputs.nuget_artifacts }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-resources
          path: |
            ${{ steps.artifactsPath.outputs.nuget_artifacts }}/*.nupkg
            ${{ steps.artifactsPath.outputs.nuget_artifacts }}/*.snupkg

      - name: Require NUGET_API_KEY
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Secret NUGET_API_KEY 未配置。请在仓库 Settings → Secrets and variables → Actions 中添加。"
            exit 1
          fi

      - name: Publish packages to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "${{ steps.artifactsPath.outputs.nuget_artifacts }}"/*.nupkg --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
